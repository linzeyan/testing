[package]
name = "apitool"
version = "0.27.0"
edition = "2024"

[dependencies]
base64 = "0.23"
csv = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit"] }
futures-util = "0.3"
getrandom = "0.3"
http-body-util = "0.1.5"
jsonschema = { version = "0.58.3", default-features = false }
memmap2 = "0.9.11"
memory-stats = "1.2.0"
p12-keystore = "0.3"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "charset", "gzip", "query", "form", "multipart", "stream", "cookies"] }
reqwest-websocket = "0.6"
rquickjs = { version = "0.14", features = ["parallel"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Already in the tree via reqwest's multipart; declared to type upload parts.
mime_guess = { version = "2", default-features = false }
# Digest auth. sha2 is already in the tree (p12-keystore); md-5 shares its digest crate.
md-5 = "0.11"
sha2 = "0.11"
# Already in the tree via reqwest's charset feature: decodes a body read in capped chunks
# the way reqwest's text() would.
encoding_rs = "0.8"
# reqwest's own cookie store; used directly to list, delete and persist cookies.
cookie_store = "0.22"
toml = "1"
# The workspace store. Bundled: no system SQLite on Windows, and one version everywhere.
rusqlite = { version = "0.40", features = ["bundled"] }
# MQTT client. No provider of its own: TLS uses the ring one net.rs installs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
# Already in the tree via reqwest: the OS trust store (policy-installed roots on Windows)
# for mqtts://, as reqwest uses it for https.
rustls-platform-verifier = "0.7"

[target."cfg(windows)".dependencies]
# WinHTTP reads IE/Edge proxy settings and does WPAD discovery the way the OS does.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
# A fake MQTT broker's buffers, for rumqttc's packet codec.
bytes = "1"
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
h2 = "0.4.19"
http = "1.5.0"
rcgen = "0.14"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
