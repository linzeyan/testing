[package]
name = "apitool"
version = "0.105.0"
edition = "2024"

[dependencies]
base64 = "0.23"
csv = "1"
# x11 and wayland matter only on Linux, where winit needs at least one; both load their
# libraries at run time, so building needs none installed.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "x11", "wayland"] }
# Already in the tree via eframe (PNG, for icons); JPEG added for the response preview.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# No raster-images (pictures inside an SVG) or svgz: those pull in more decoders.
# Pure-Rust PDF rasterizer; embeds stand-ins for the 14 standard fonts (~240 KB).
hayro = "0.7"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
futures-util = "0.3"
getrandom = "0.3"
http-body-util = "0.1.5"
jsonschema = { version = "0.58.3", default-features = false }
# Already in the tree via jsonschema: find in the response body (case, whole word, pattern).
regex = "1"
# Already in the tree (egui, wgpu, reqwest): their warnings reach our log too.
log = "0.4"
memmap2 = "0.9.11"
memory-stats = "1.2.0"
p12-keystore = "0.3"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
# socks: implemented in hyper-util, which is already here; no crate of its own.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "charset", "gzip", "query", "form", "multipart", "stream", "cookies", "socks"] }
reqwest-websocket = "0.6"
rquickjs = { version = "0.14", features = ["parallel"] }
# A read-only XML tree for the response filter's XPath; no dependencies of its own.
roxmltree = "0.21"
# Already in the tree as rustls's crypto provider: HMAC-SHA256 for AWS Signature v4.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Already in the tree through reqwest: for timing new connections.
tower-layer = "0.3"
tower-service = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Already in the tree via reqwest's multipart; declared to type upload parts.
mime_guess = { version = "2", default-features = false }
# Digest auth. sha2 is already in the tree (p12-keystore); md-5 shares its digest crate.
md-5 = "0.11"
sha2 = "0.11"
# Already in the tree via reqwest's charset feature: decodes a body read in capped chunks
# the way reqwest's text() would.
encoding_rs = "0.8"
# reqwest's own cookie store; used directly to list, delete and persist cookies.
cookie_store = "0.22"
toml = "1"
# OpenAPI specs are mostly YAML. The maintained fork of serde_yaml; parses into serde_json
# values, so one reader serves JSON and YAML specs.
serde_yaml_ng = "0.10"
# The workspace store. Bundled: no system SQLite on Windows, and one version everywhere.
rusqlite = { version = "0.40", features = ["bundled"] }
# MQTT client. No provider of its own: TLS uses the ring one net.rs installs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket", "proxy"] }
# Already in the tree via reqwest, which reads the system proxy with it: MQTT asks it the
# same question for the broker. Its HttpInfo tells a response's connection from one that
# opened beside it.
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "client-proxy", "client-proxy-system", "tokio"] }
http = "1.5.0"
# Already in the tree via reqwest: the OS trust store (policy-installed roots on Windows)
# for mqtts://, as reqwest uses it for https.
rustls-platform-verifier = "0.7"
# Native open/save dialogs (Import…, Save…, Browse… next to every path). On Windows and
# macOS it calls the OS dialogs through windows-sys / objc2, both already in the tree.
rfd = { version = "0.17", default-features = false }
egui-phosphor = "0.14"
# Already in the tree via reqwest's http2: the window's MCP endpoint also takes h2c.
h2 = "0.4.19"
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux has no dialog of its own: ask the desktop portal.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target."cfg(windows)".dependencies]
# WinHTTP reads IE/Edge proxy settings and does WPAD discovery the way the OS does.
# DPAPI seals environment secrets in apitool.db (see vault.rs).
# DWM and WM_NCACTIVATE switch the title bar with the theme (see appearance.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
rcgen = "0.14"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
