[package]
name = "apitool"
version = "0.5.0"
edition = "2024"

[dependencies]
base64 = "0.23"
csv = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit"] }
futures-util = "0.3"
getrandom = "0.3"
http-body-util = "0.1.5"
jsonschema = { version = "0.58.3", default-features = false }
memmap2 = "0.9.11"
memory-stats = "1.2.0"
p12-keystore = "0.3"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "charset", "gzip", "query", "form", "multipart", "stream"] }
reqwest-websocket = "0.6"
rquickjs = { version = "0.14", features = ["parallel"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
# Already in the tree via reqwest's multipart; declared to type upload parts.
mime_guess = { version = "2", default-features = false }
toml = "1"

[target."cfg(windows)".dependencies]
windows-registry = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
h2 = "0.4.19"
http = "1.5.0"
rcgen = "0.14"
tokio = { version = "1", features = ["net"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
