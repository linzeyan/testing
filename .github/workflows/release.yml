name: release

# main's run checks, tests, builds and packages each commit, once. A v* tag's run compiles
# nothing: it waits for main's run of the tagged commit and publishes what that built.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  # The tag's run reads main's run and downloads its artifacts.
  actions: read

jobs:
  build:
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            check: true
          - os: macos-latest
            target: aarch64-apple-darwin
            check: true
          # Cross-built on the arm runner; tests already ran natively above.
          - os: macos-latest
            target: x86_64-apple-darwin
            check: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            check: true
          # Native on GitHub's arm runner (free for public repositories); tests already ran
          # on x86_64 Linux above.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            check: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy
        if: matrix.check
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: matrix.check
        shell: bash
        # Failures go into an annotation too: those can be read through the API with a
        # plain token, job logs can't.
        # `shell: bash` runs with -e and pipefail: a failing test would end the script at
        # the pipe, before the annotation.
        run: |
          set +e +o pipefail
          cargo test --locked 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E -A 6 'panicked at|^---- |^error' test.log | head -80)
            # A crash (a signal) prints no panic: the end of the log says what happened.
            [ -n "$msg" ] || msg=$(tail -40 test.log)
            msg=$(printf '%s\n' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::$msg"
          fi
          exit "$code"
      - name: Build
        # The smallest binary that runs no slower (macOS arm64: 46 MB -> 30 MB): whole-program
        # LTO in one codegen unit drops and merges more code and is as fast or faster, and
        # the symbol table is never read at run time (a panic's log keeps its file and line,
        # its backtrace loses names). Not opt-level s/z (smaller, slower code), UPX (unpacked
        # into private memory at each start; no macOS) or panic=abort (a worker thread's
        # panic would take the window with it). Here, not in Cargo.toml: local builds stay
        # quick.
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        # Named for Cargo.toml's version, as the update check looks for it: the tag that
        # publishes it isn't pushed yet.
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="apitool-v$version-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "dist/$name.zip" "./$dir/apitool.exe" "./$dir/apitool-cli.exe"
          else
            tar -C "$dir" -czf "dist/$name.tar.gz" apitool apitool-cli
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for main's run of this commit
        run: |
          # The tag is pushed right after main, so main's run may take a moment to show.
          for _ in $(seq 30); do
            run=$(gh run list --workflow release.yml --branch main --event push \
              --commit "$GITHUB_SHA" --limit 1 --json databaseId -q '.[].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::main has no run of $GITHUB_SHA: push the commit to main before tagging it"
            exit 1
          fi
          while [ "$(gh run view "$run" --json status -q .status)" != completed ]; do
            sleep 30
          done
          if [ "$(gh run view "$run" --json conclusion -q .conclusion)" != success ]; then
            echo "::error::main's run $run of this commit didn't pass: nothing to publish"
            exit 1
          fi
          echo "RUN=$run" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          gh run download "$RUN" --dir dist
          # A folder per artifact. A tag that isn't Cargo.toml's version matches nothing.
          files=(dist/*/apitool-"$GITHUB_REF_NAME"-*)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::main built $(ls dist/*/), not $GITHUB_REF_NAME"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
