name: release

on:
  push:
    # A tag's run can only restore caches saved on its own ref or on main, so with tags
    # alone every release built from scratch. main's runs keep the cache warm.
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            check: true
          - os: macos-latest
            target: aarch64-apple-darwin
            check: true
          # Cross-built on the arm runner; tests already ran natively above.
          - os: macos-latest
            target: x86_64-apple-darwin
            check: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            check: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # No later run can read a tag's cache; saving it would only push main's out of
          # the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        if: matrix.check
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: matrix.check
        shell: bash
        # Failures go into an annotation too: those can be read through the API with a
        # plain token, job logs can't.
        # `shell: bash` runs with -e and pipefail: a failing test would end the script at
        # the pipe, before the annotation.
        run: |
          set +e +o pipefail
          cargo test --locked 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E -A 6 'panicked at|^---- |^error' test.log | head -80)
            # A crash (a signal) prints no panic: the end of the log says what happened.
            [ -n "$msg" ] || msg=$(tail -40 test.log)
            msg=$(printf '%s\n' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::$msg"
          fi
          exit "$code"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          name="apitool-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "dist/$name.zip" "./$dir/apitool.exe" "./$dir/apitool-cli.exe"
          else
            tar -C "$dir" -czf "dist/$name.tar.gz" apitool apitool-cli
          fi
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
